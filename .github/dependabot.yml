version: 2

# Only GitHub Actions is watched here, and that is deliberate.
#
# The addon itself has no third-party dependencies (plain Lua against the game's
# own API), so there is nothing else for Dependabot to check. Staying
# dependency-free is a design goal, not an oversight.
#
# Actions are a different matter: a workflow step runs someone else's code in
# CI, so keeping those pinned versions current is worth automating.
#
# Monthly rather than weekly: only a few actions are in use, so a tighter
# cadence would only add noise for a single maintainer.
#
# Pull requests target `beta`, matching CONTRIBUTING.md. `main` only ever
# receives merges from `beta` or release commits.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

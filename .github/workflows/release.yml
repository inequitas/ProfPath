# Builds the addon zip and uploads it to CurseForge (and a GitHub release) when a version tag is pushed.
# Release: raise "## Version:" in ProfPath.toc, commit, then:  git tag v0.1.1 ; git push origin v0.1.1
# Needs the repository secret CF_API_KEY (a CurseForge API token). The CurseForge project ID comes from
# "## X-Curse-Project-ID" in ProfPath.toc; the game version (WoW Forever) from "## Interface: 16001".
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history, for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

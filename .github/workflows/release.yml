name: Release

# Builds the addon zip and uploads it to CurseForge (WoW Forever) and to a GitHub
# release when a version tag is pushed.
#
# To release: merge beta into main, raise "## Version:" in ProfPath.toc, commit,
# then tag that commit on main and push the tag:
#   git tag -s v0.1.1 -m "ProfPath 0.1.1"
#   git push origin v0.1.1
#
# Needs the repository secret CF_API_KEY (a CurseForge API token). The project
# comes from "## X-Curse-Project-ID" in ProfPath.toc and the game version from
# "## Interface: 16001"; .pkgmeta keeps tools, tests and notes out of the zip.

on:
  push:
    tags:
      - "v*"

# contents: write is needed to create the GitHub release; nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for the changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

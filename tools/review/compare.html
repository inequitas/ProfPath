<!doctype html>
<html><head><meta charset="utf-8"><title>Route vs guide</title>
<style>
body{background:#1b1b1b;color:#ddd;font:13px sans-serif;margin:0}
.pair{display:flex;gap:8px;padding:6px;border-bottom:1px solid #333;align-items:flex-start}
.pair h3{margin:0 0 4px;font-size:14px}
svg,img{width:620px;height:auto;display:block}
</style></head><body>
<div id="out">loading…</div>
<script>
// Our routes (review.json) next to wow-professions.com Classic guide maps, for visual comparison.
const G = 'https://www.wow-professions.com/images/forever/';
const GUIDES = [
  ['mining',1,"Durotar",'mining-leveling-forever-durotar.webp'],
  ['mining',1,"Mulgore",'mining-leveling-forever-mulgore-forge.webp'],
  ['mining',1,"Tirisfal Glades",'mining-leveling-forever-tirisfal-glades.webp'],
  ['mining',1,"Zephras Isle",'mining-leveling-forever-zephras-isle.webp'],
  ['mining',1,"Elwynn Forest",'mining-leveling-forever-elwynn-forest.webp'],
  ['mining',1,"Dun Morogh",'mining-leveling-forever-dun-morogh.webp'],
  ['mining',1,"Teldrassil",'mining-leveling-forever-teldrassil.webp'],
  ['mining',65,"Wetlands",'mining-leveling-forever-wetlands.webp'],
  ['mining',65,"Silverpine Forest",'mining-leveling-forever-silverpine-forest.webp'],
  ['mining',65,"Westfall",'mining-leveling-forever-westfall.webp'],
  ['mining',65,"Hillsbrad Foothills",'mining-leveling-forever-hillsbrad-foothills.webp'],
  ['mining',65,"The Barrens",'mining-leveling-forever-the-barrens.webp'],
  ['mining',65,"Ashenvale",'mining-leveling-forever-ashenvale.webp'],
  ['mining',65,"Stonetalon Mountains",'mining-leveling-forever-stonetalon-mountains.webp'],
  ['mining',125,"Arathi Highlands",'mining-leveling-forever-arathi-highlands.webp'],
  ['mining',125,"Thousand Needles",'mining-leveling-forever-thousand-needles.webp'],
  ['mining',125,"Desolace",'mining-leveling-forever-desolace.webp'],
  ['mining',175,"The Hinterlands",'mining-leveling-forever-the-hinterlands.webp'],
  ['mining',175,"Tanaris",'mining-leveling-forever-tanaris.webp'],
  ['mining',225,"Un'Goro Crater",'mining-leveling-forever-ungoro-crater.webp'],
  ['mining',225,"Blasted Lands",'mining-leveling-forever-blasted-lands.webp'],
  ['mining',225,"Felwood",'mining-leveling-forever-felwood.webp'],
  ['mining',275,"Un'Goro Crater",'mining-leveling-forever-ungoro-crater-rich-thorium.webp'],
  ['mining',275,"Eastern Plaguelands",'mining-leveling-forever-eastern-plaguelands.webp'],
  ['mining',275,"Winterspring",'mining-leveling-forever-winterspring.webp'],
  ['mining',275,"Burning Steppes",'mining-leveling-forever-burning-steppes.webp'],
  ['herbalism',1,"Durotar",'herbalism-leveling-forever-durotar.webp'],
  ['herbalism',1,"Mulgore",'herbalism-leveling-forever-mulgore.webp'],
  ['herbalism',1,"Tirisfal Glades",'herbalism-leveling-forever-tirisfal-glades.webp'],
  ['herbalism',1,"Zephras Isle",'herbalism-leveling-forever-zephras-isle.webp'],
  ['herbalism',1,"Elwynn Forest",'herbalism-leveling-forever-elwynn-forest.webp'],
  ['herbalism',1,"Dun Morogh",'herbalism-leveling-forever-dun-morogh.webp'],
  ['herbalism',1,"Teldrassil",'herbalism-leveling-forever-teldrassil.webp'],
  ['herbalism',70,"Silverpine Forest",'herbalism-leveling-forever-silverpine-forest.webp'],
  ['herbalism',70,"Loch Modan",'herbalism-leveling-forever-loch-modan.webp'],
  ['herbalism',70,"Darkshore",'herbalism-leveling-forever-darkshore.webp'],
  ['herbalism',115,"Hillsbrad Foothills",'herbalism-leveling-forever-hillsbrad-foothills.webp'],
  ['herbalism',115,"Stonetalon Mountains",'herbalism-leveling-forever-stonetalon-mountains.webp'],
  ['herbalism',170,"Stranglethorn Vale",'herbalism-leveling-forever-stranglethorn-vale.webp'],
  ['herbalism',170,"Arathi Highlands",'herbalism-leveling-forever-arathi-highlands.webp'],
  ['herbalism',205,"Tanaris",'herbalism-leveling-forever-tanaris.webp'],
  ['herbalism',205,"Searing Gorge",'herbalism-leveling-forever-searing-gorge.webp'],
  ['herbalism',225,"The Hinterlands",'herbalism-leveling-forever-the-hinterlands.webp'],
  ['herbalism',260,"Felwood",'herbalism-leveling-forever-felwood.webp'],
];
fetch('review.json').then(r => r.json()).then(j => {
  const html = [];
  GUIDES.forEach(([kind, from, zone, img], i) => {
    // our route in that zone for the guide's band (or the nearest band that has the zone)
    let cands = j.routes.filter(r => r.kind === kind && r.zone.toLowerCase() === zone.toLowerCase());
    cands.sort((a, b) => Math.abs(a.from - from) - Math.abs(b.from - from));
    const r = cands[0];
    let left = '<div style="width:620px;height:413px;display:flex;align-items:center;justify-content:center;background:#222">no route of ours in this zone</div>';
    let title = `${zone} — guide band ${from}+`;
    if (r) {
      const pts = []; for (let k = 0; k < r.route.length; k += 2) pts.push((r.route[k] * 10).toFixed(1) + ',' + (r.route[k + 1] * 6.68).toFixed(1));
      const dots = r.nodes.map(n => `<circle cx="${n[0] * 10}" cy="${n[1] * 6.68}" r="4" fill="#ffd400" stroke="#000" stroke-width="1"/>`).join('');
      left = `<svg viewBox="0 0 1002 668"><image href="https://wow.zamimg.com/images/wow/classicplus/maps/enus/original/${r.area}.jpg" width="1002" height="668"/>${dots}<polygon points="${pts.join(' ')}" fill="none" stroke="#ff3b10" stroke-width="6" stroke-linejoin="round"/></svg>`;
      title = `${i + 1}. ${zone} — ours: ${r.kind} ${r.from}-${r.to} (${r.id}, ${r.len} yd, share ${r.share}) — guide band ${from}+`;
    }
    html.push(`<div class="pair" id="p${i + 1}"><div><h3>${title}</h3>${left}</div><div><h3>wow-professions.com (WoW Forever)</h3><img src="${G + img}"></div></div>`);
  });
  document.getElementById('out').innerHTML = html.join('');
});
</script></body></html>
